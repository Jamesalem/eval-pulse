name: Go Test & Architecture Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Unit Tests & Race Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true
          cache-dependency-path: go.sum

      # go.sum is authoritative: verify module hashes instead of regenerating
      # the file, and fail if go.mod/go.sum are not tidy.
      - name: Verify Dependencies
        run: |
          go mod download
          go mod verify
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Check Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # Redis-dependent tests use an in-process miniredis, so no service container is needed.
      - name: Run Unit Tests with Race Detector
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage-report
          path: coverage.out
